- group: Sourced information
  items:
    - name: korrents
      url: https://korrents.com
      meta: web app
      desc: A public belief journal. What people currently believe, when they said it, and what changed their minds.
    - name: ppll
      url: https://ppll.app
      meta: web app
      desc: One page per public figure. Where they actually publish, and what they are on record saying, in their own words.
    - name: rcmnd
      url: https://rcmnd.app
      meta: web app
      desc: Books, tools and hardware recommended by named people, every entry traced back to the public post where they said it.
    - name: niuz
      url: https://niuz.app
      meta: web app
      desc: The news reduced to the points that matter, and which outlets report each one.
    - name: wiqqi
      url: https://wiqqi.app
      meta: web app
      desc: A wiki of organizations, podcasts, people and events. What each one is, who is behind it, and where every fact comes from.
    - name: ybooks
      url: https://ybooks.app
      meta: web app
      desc: The case for reading books. The evidence with its caveats, quotes from notable readers, and what named people are reading now.
    - name: reachdex
      url: https://reachdex.kapps.dev
      meta: web app
      desc: A curated index of how to actually reach people, organizations and projects, and which of their channels are dead.
    - name: whosaid
      url: https://whosaid.kapps.dev
      meta: web app
      desc: Speaker-attributed transcripts of podcasts and interviews, with timestamps.

- group: Places
  items:
    - name: loqation
      url: https://loqation.app
      meta: web app
      desc: Every town on earth, one page each. 34,000 places with their weather, air quality, events and what is nearby.
    - name: Agenda PT
      url: https://agenda.kapps.dev
      meta: web app
      desc: Every event in Portugal, searchable by date, category, city and map.
    - name: airhome
      url: https://airhome.kapps.dev
      meta: web app
      desc: Type a Portuguese address and see what you would be breathing there, from the nearest official monitors.
    - name: produqt
      url: https://produqt.app
      meta: web app
      desc: The same product at Continente and Auchan, matched by barcode, with the nearest store of each chain.
    - name: Prayer times
      url: https://prayertimes.kapps.dev
      meta: web app
      desc: Prayer times for any city, without ads. The calculation method always shown, Qibla direction and a month table.
    - name: Ping
      url: https://ping.kapps.dev
      meta: web app
      desc: Type a city, see whether it is a reasonable hour to message someone there.

- group: Listening
  items:
    - name: podqast
      url: https://podqast.app
      meta: web app
      desc: Every episode of 550 podcasts in 29 languages, searchable by subject and by who is on them, with English notes under the originals.
    - name: Global Radio
      url: https://globalradio.app
      meta: web app
      desc: Eleven thousand live radio stations from 172 countries. Free, no signup.
    - name: Audiobooks
      url: https://audiobooks.kapps.dev
      meta: web app
      desc: Public-domain audiobooks from LibriVox, without the ads. Pick a book and press play.
    - name: Sleep sounds
      url: https://sleepsounds.kapps.dev
      meta: web app
      desc: Rain, ocean, fire and noise. Mix them, set a timer, and it keeps playing with the screen off.

- group: Language learning
  items:
    - name: How to Learn
      url: https://howtolearn.app
      meta: web app
      desc: A filterable directory of the best resources for learning any language. Apps, podcasts, channels, courses, books and communities.
    - name: Lingush
      url: https://podqast.app/portuguese/for-learners
      meta: web app
      desc: Native Portuguese podcasts as listening practice. Now part of podqast.
    - name: pt-variant
      url: https://github.com/eyalev/pt-variant
      meta: Python
      desc: Tells you if a YouTube video is European or Brazilian Portuguese, from the transcript. CLI, web app and API.
    - name: language-learning-resources
      url: https://github.com/eyalev/language-learning-resources
      meta: open data
      desc: 800+ resources across 30+ languages as JSON and CSV, with honest notes on each one.

- group: Tools
  items:
    - name: CodeSpeek
      url: https://codespeek.com
      meta: web app
      desc: Practise coding interviews out loud. You describe the code, an AI interviewer writes exactly what you said and asks follow-ups.
    - name: Readable PDF
      url: https://pdf.kapps.dev
      meta: web app
      desc: Turn any PDF into a clean web page you can actually read.
    - name: WishWiki
      url: https://wishwiki.com
      meta: web app
      desc: A wiki where pages come into existence when you wish for them.
    - name: gitbox
      url: https://github.com/eyalev/gitbox
      meta: Rust
      desc: Sync files between computers with git and GitHub, without thinking about git.

- group: Agent tooling
  items:
    - name: ttyview
      url: https://github.com/ttyview/ttyview
      meta: Rust
      desc: Watch tmux sessions from a browser. Sends a cell grid instead of running a terminal emulator client side, which is what makes it work on a phone.
    - name: mobile-cc
      url: https://github.com/eyalev/mobile-cc
      meta: Rust
      desc: The same idea packaged for one job, driving Claude Code from a phone.
    - name: herdr-web
      url: https://github.com/eyalev/herdr-web
      meta: TypeScript
      desc: Mobile web UI for the herdr agent multiplexer. Agent state at a glance, so you notice the one waiting on you.
    - name: cc-usage-json
      url: https://github.com/eyalev/cc-usage-json
      meta: Rust
      desc: Claude Code usage as JSON you can script against, either over OAuth or by scraping the TUI.
    - name: claude-code-manager
      url: https://github.com/eyalev/claude-code-manager
      meta: Rust
      desc: Manage Claude Code sessions through tmux. Send messages, detect when a run is done.

- group: Other
  items:
    - name: awesome-reading-lists
      url: https://github.com/eyalev/awesome-reading-lists
      meta: list
      desc: Reading lists from people worth reading. Bookshelves instead of an algorithm.
