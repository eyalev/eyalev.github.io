---
layout: default
title: Notes
section: notes
permalink: /notes/
---
<h1>notes</h1>
<p>Short things. Half-formed on purpose.</p>
{% if site.notes.size > 0 %}
<div class="rows">
  {% for n in site.notes %}
  <div class="t"><a href="{{ n.url }}">{{ n.title }}</a></div>
  <time>{{ n.date | date: "%Y-%m-%d" }}</time>
  {% endfor %}
</div>
{% else %}
<p class="empty">Nothing here yet.</p>
{% endif %}
