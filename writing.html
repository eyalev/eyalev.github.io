---
layout: default
title: Writing
section: writing
permalink: /writing/
---
<h1>writing</h1>
{% if site.posts.size > 0 %}
<div class="rows">
  {% for post in site.posts %}
  <div class="t"><a href="{{ post.url }}">{{ post.title }}</a></div>
  <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
  {% endfor %}
</div>
{% else %}
<p class="empty">Nothing here yet.</p>
{% endif %}
