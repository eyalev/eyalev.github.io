<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/assets/style.css">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
</head>
<body>
<div class="wrap">

<header class="site">
  <a class="name" href="/">eyal levin</a>
  <nav>
    <a href="/writing/"{% if page.section == "writing" %} aria-current="page"{% endif %}>writing</a>
    <a href="/notes/"{% if page.section == "notes" %} aria-current="page"{% endif %}>notes</a>
    <a href="/reading/"{% if page.section == "reading" %} aria-current="page"{% endif %}>reading</a>
    <a href="/about/"{% if page.section == "about" %} aria-current="page"{% endif %}>about</a>
  </nav>
</header>

{{ content }}

<footer class="site">
  <a href="https://github.com/eyalev">github</a>
  <a href="https://www.linkedin.com/in/eyalev/">linkedin</a>
  <a href="mailto:eyalev@gmail.com">eyalev@gmail.com</a>
  <a href="/feed.xml">rss</a>
</footer>

</div>
</body>
</html>
