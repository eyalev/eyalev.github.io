<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
{% if page.noindex %}<meta name="robots" content="noindex">
{% endif %}<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body{% if page.home %} class="home"{% endif %}>
<div class="wrap">

{% unless page.home %}
<header class="site">
  <a class="name" href="/">Eyal Levin</a>
  <nav>
    <a href="/projects/"{% if page.section == "projects" %} aria-current="page"{% endif %}>Projects</a>
    <a href="/about/"{% if page.section == "about" %} aria-current="page"{% endif %}>About</a>
  </nav>
</header>
{% endunless %}

<main>
{{ content }}
</main>

{% unless page.home %}
<footer class="site">
  <a href="mailto:hello@eyalev.com">hello@eyalev.com</a>
  <a href="https://github.com/eyalev">GitHub</a>
  <a href="https://www.linkedin.com/in/eyalev/">LinkedIn</a>
</footer>
{% endunless %}

</div>
</body>
</html>
